<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Wunsch-Pizza</title>
</head>
<body>
    <h1>Wunsch-Pizza</h1>

    <label for="ingredients">Verfügbare Zutaten:</label><br>
    <select id="ingredients" size="8">
        <option>Tomatensauce</option>
        <option>Mozzarella</option>
        <option>Champignons</option>
        <option>Peperoni</option>
        <option>Oliven</option>
        <option>Zwiebeln</option>
        <option>Schinken</option>
        <option>Mais</option>
    </select>

    <button id="add" type="button">Hinzufügen &gt;</button>
    <button id="remove" type="button">&lt; Entfernen</button>

    <label for="choice">Deine Pizza:</label><br>
    <select id="choice" size="8"></select>

    <script src="script.js"></script>
</body>
</html>
